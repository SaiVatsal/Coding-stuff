; =============================================================================
; miniMiner — ESP32 Bitcoin Solo Miner
; PlatformIO Project Configuration
; =============================================================================
; Supports: ESP32, ESP32-S2, ESP32-S3, ESP32-C3
; Select your board by building the matching [env:...] target
; =============================================================================

[platformio]
default_envs = lilygo-t-display-s3

; ---------------------------------------------------------------------------
; Shared base configuration for ALL boards
; ---------------------------------------------------------------------------
[env]
framework = arduino
platform = espressif32@^6.4.0
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
board_build.filesystem = littlefs
board_build.partitions = min_spiffs.csv

lib_deps =
    bblanchon/ArduinoJson@^6.21.3
    bodmer/TFT_eSPI@^2.5.34
    arduino-libraries/NTPClient@^3.2.1
    https://github.com/tzapu/WiFiManager.git#v2.0.17

build_flags =
    -DMINI_MINER_VERSION=\"1.0.0\"
    -DCORE_DEBUG_LEVEL=1
    -DARDUINO_USB_CDC_ON_BOOT=0

; ---------------------------------------------------------------------------
; LILYGO T-Display S3 (ESP32-S3, 1.9" TFT 170x320, primary target)
; ---------------------------------------------------------------------------
[env:lilygo-t-display-s3]
board = lilygo-t-display-s3
board_build.arduino.memory_type = qio_opi
build_flags =
    ${env.build_flags}
    -DBOARD_LILYGO_T_DISPLAY_S3=1
    ; TFT_eSPI config for T-Display S3 (8-bit parallel ST7789)
    -DUSER_SETUP_LOADED=1
    -DST7789_DRIVER=1
    -DTFT_PARALLEL_8_BIT=1
    -DTFT_WIDTH=170
    -DTFT_HEIGHT=320
    -DTFT_CS=6
    -DTFT_DC=7
    -DTFT_RST=5
    -DTFT_WR=8
    -DTFT_RD=9
    -DTFT_D0=39
    -DTFT_D1=40
    -DTFT_D2=41
    -DTFT_D3=42
    -DTFT_D4=45
    -DTFT_D5=46
    -DTFT_D6=47
    -DTFT_D7=48
    -DTFT_BACKLIGHT_ON=1
    -DTFT_BL=38
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DLOAD_FONT8=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1

; ---------------------------------------------------------------------------
; LILYGO T-Display (ESP32, 1.14" TFT 135x240)
; ---------------------------------------------------------------------------
[env:lilygo-t-display]
board = lilygo-t-display
build_flags =
    ${env.build_flags}
    -DBOARD_LILYGO_T_DISPLAY=1
    -DUSER_SETUP_LOADED=1
    -DST7789_DRIVER=1
    -DTFT_WIDTH=135
    -DTFT_HEIGHT=240
    -DTFT_MISO=-1
    -DTFT_MOSI=19
    -DTFT_SCLK=18
    -DTFT_CS=5
    -DTFT_DC=16
    -DTFT_RST=23
    -DTFT_BL=4
    -DTFT_BACKLIGHT_ON=1
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1

; ---------------------------------------------------------------------------
; ESP32-WROOM-32 DevKit (no display)
; ---------------------------------------------------------------------------
[env:esp32-devkit]
board = esp32dev
build_flags =
    ${env.build_flags}
    -DBOARD_ESP32_DEVKIT=1

; ---------------------------------------------------------------------------
; ESP32-S3 DevKitC (no display)
; ---------------------------------------------------------------------------
[env:esp32-s3-devkitc]
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
build_flags =
    ${env.build_flags}
    -DBOARD_ESP32_S3_DEVKITC=1

; ---------------------------------------------------------------------------
; ESP32-S2 Mini (single-core, no display)
; ---------------------------------------------------------------------------
[env:esp32-s2-mini]
board = lolin_s2_mini
build_flags =
    ${env.build_flags}
    -DBOARD_ESP32_S2_MINI=1

; ---------------------------------------------------------------------------
; ESP32-C3 SuperMini (RISC-V single-core, no display)
; ---------------------------------------------------------------------------
[env:esp32-c3-supermini]
board = esp32-c3-devkitm-1
build_flags =
    ${env.build_flags}
    -DBOARD_ESP32_C3_SUPERMINI=1

; ---------------------------------------------------------------------------
; M5Stack StickC Plus (ESP32-PICO, 1.14" TFT 135x240)
; ---------------------------------------------------------------------------
[env:m5stick-c-plus]
board = m5stick-c
build_flags =
    ${env.build_flags}
    -DBOARD_M5STICK_C_PLUS=1
    -DUSER_SETUP_LOADED=1
    -DST7789_DRIVER=1
    -DTFT_WIDTH=135
    -DTFT_HEIGHT=240
    -DTFT_MISO=-1
    -DTFT_MOSI=15
    -DTFT_SCLK=13
    -DTFT_CS=5
    -DTFT_DC=23
    -DTFT_RST=18
    -DTFT_BL=-1
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1
