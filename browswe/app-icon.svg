<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0f"/>
      <stop offset="50%" stop-color="#141420"/>
      <stop offset="100%" stop-color="#1c1c2e"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="50%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" stroke="#2a2a3e" stroke-width="4"/>
  
  <!-- Subtle inner ambient glow ring -->
  <rect x="32" y="32" width="448" height="448" rx="92" fill="none" stroke="url(#accentGrad)" stroke-width="2" opacity="0.4"/>

  <!-- Glowing background polygon for the 'A' -->
  <polygon points="256,90 390,380 320,380 290,310 222,310 192,380 122,380" fill="url(#accentGrad)" filter="url(#glow)" opacity="0.4"/>

  <!-- Sharp Main 'A' Structure -->
  <polygon points="256,90 390,380 320,380 290,310 222,310 192,380 122,380" fill="url(#accentGrad)"/>
  
  <!-- Inner Triangle Cutout -->
  <polygon points="256,170 276,255 236,255" fill="#141420"/>

  <!-- Futuristic Cyan Crossbeam Accent -->
  <rect x="210" y="275" width="92" height="18" rx="9" fill="url(#cyanGrad)"/>

  <!-- Sparkle top-right accent -->
  <circle cx="370" cy="130" r="14" fill="#38bdf8" filter="url(#glow)"/>
  <circle cx="370" cy="130" r="8" fill="#ffffff"/>
</svg>
