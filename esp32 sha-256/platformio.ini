; ESP32 Bitcoin Solo Miner - LILYGO T-Display S3
; Educational "lottery mining" device using Stratum V1
;
; Flash with: pio run -t upload
; Monitor:    pio device monitor -b 115200

[platformio]
default_envs = lilygo-t-display-s3

[env:lilygo-t-display-s3]
platform          = espressif32@6.7.0
board             = lilygo-t-display-s3
framework         = arduino
monitor_speed     = 115200
upload_speed      = 921600

; Partition: huge_app.csv gives ~7.5MB app for web assets + code
board_build.partitions = default_8MB.csv
board_build.filesystem = littlefs
board_build.arduino.memory_type = qio_opi

; PSRAM enabled (8MB OPI on T-Display S3)
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=1
    -DASYNC_TCP_SSL_ENABLED=1
    -DCONFIG_ASYNC_TCP_USE_WDT=0
    -DSTRATUM_POOL_HOST=\"solo.ckpool.org\"
    -DSTRATUM_POOL_PORT=3333
    -DDEFAULT_MINING_DIFF=10000

lib_deps =
    bblanchon/ArduinoJson@^7.0.0
    mathieucarbou/AsyncTCP@^3.2.0
    mathieucarbou/ESPAsyncWebServer@^3.1.0
    lewisxhe/XPowersLib@^0.0.5
    https://github.com/lovyan03/LovyanGFX.git

monitor_filters = esp32_exception_decoder, time
