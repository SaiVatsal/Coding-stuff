[package]
name = "wrk"
version = "0.1.0"
edition = "2021"
authors = ["wrk contributors"]
description = "A fast, modern HTTP benchmarking tool inspired by wrk with Lua scripting"

[dependencies]
tokio = { version = "1.43", features = ["rt-multi-thread", "net", "io-util", "time", "macros", "sync", "signal"] }
clap = { version = "4.5", features = ["derive"] }
httparse = "1.10"
hdrhistogram = "7.5"
mlua = { version = "0.10", features = ["lua54", "vendored", "send"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "0.26"
url = "2.5"
bytes = "1.10"
anyhow = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
